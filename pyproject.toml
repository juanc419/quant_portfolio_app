[project]
name = "quant-portfolio-app"
version = "0.1.0"
description = "Visual research workbench for comparing portfolios powered by quant-core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "quant-core>=0.1.0",
    "yfinance>=0.2.65",
    "MetaTrader5>=5.0.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
quant-core = { path = "../quant_core", editable = true }

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
